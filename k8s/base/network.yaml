apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-only
spec:
  ipWhiteList:
    sourceRange: ["127.0.0.1/32"]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-lan
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: ai-lan-lan-only@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /v1
            pathType: Prefix
            backend: {service: {name: gateway, port: {number: 8000}}}
          - path: /healthz
            pathType: Exact
            backend: {service: {name: gateway, port: {number: 8000}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: frontend, port: {number: 80}}}
