apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai-lan
resources:
  - namespace.yaml
  - postgres.yaml
  - gateway.yaml
  - frontend.yaml
  - network.yaml
configMapGenerator:
  - name: frontend-page
    files:
      - frontend/index.html
      - frontend/app.js
      - frontend/admin.html
      - frontend/admin.js
generatorOptions:
  disableNameSuffixHash: true
