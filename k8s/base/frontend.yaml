apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-page
data:
  index.html: |
    <!doctype html><html><head><meta charset="utf-8"><title>AI Gateway</title><style>body{font:16px system-ui;max-width:720px;margin:3rem auto;padding:0 1rem}textarea,input,button{width:100%;box-sizing:border-box;margin:.4rem 0;padding:.7rem}pre{white-space:pre-wrap;background:#f4f4f4;padding:1rem}</style></head><body><h1>Local AI Gateway</h1><p>This browser sends requests to your private gateway.</p><input id="key" type="password" placeholder="Gateway API key"><textarea id="prompt" rows="7" placeholder="Ask something..."></textarea><button onclick="ask()">Send</button><pre id="out"></pre><script>async function ask(){let o=document.querySelector('#out');o.textContent='Thinking…';let r=await fetch('/v1/chat/completions',{method:'POST',headers:{'content-type':'application/json','x-api-key':key.value},body:JSON.stringify({model:'upstream',messages:[{role:'user',content:prompt.value}]})});let j=await r.json();o.textContent=j.choices?.[0]?.message?.content||JSON.stringify(j,null,2)}</script></body></html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: page
          configMap: {name: frontend-page}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector: {app: frontend}
  ports:
    - port: 80
      targetPort: 80
