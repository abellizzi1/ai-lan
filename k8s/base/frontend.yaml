apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-page
data:
  index.html: |
    <!doctype html>
    <html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>AI Gateway</title>
    <style>body{font:16px system-ui;max-width:720px;margin:3rem auto;padding:0 1rem}input,textarea,button{width:100%;box-sizing:border-box;margin:.4rem 0;padding:.7rem}pre{white-space:pre-wrap;background:#f4f4f4;padding:1rem}.hidden{display:none}</style></head>
    <body><h1>Local AI Gateway</h1><p id="who"></p>
    <form id="login"><h2>Sign in</h2><input id="username" autocomplete="username" placeholder="Username" required><input id="password" type="password" autocomplete="current-password" placeholder="Password" required><button>Sign in</button></form>
    <section id="admin" class="hidden"><h2>Create household account</h2><input id="new-username" placeholder="Username"><input id="new-password" type="password" placeholder="Password (12+ characters)"><button id="create">Create account</button></section>
    <section id="chat" class="hidden"><textarea id="prompt" rows="7" placeholder="Ask something..."></textarea><button id="send">Send</button><button id="logout">Sign out</button></section><pre id="out"></pre>
    <script>
    const login=document.querySelector('#login'),chat=document.querySelector('#chat'),admin=document.querySelector('#admin'),out=document.querySelector('#out');
    async function refresh(){let r=await fetch('/auth/me');let u=r.ok?await r.json():null;login.classList.toggle('hidden',!!u);chat.classList.toggle('hidden',!u);admin.classList.toggle('hidden',!u?.is_admin);document.querySelector('#who').textContent=u?'Signed in as '+u.username:''}
    login.onsubmit=async e=>{e.preventDefault();let r=await fetch('/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:document.querySelector('#username').value,password:document.querySelector('#password').value})});if(!r.ok){out.textContent='Sign-in failed';return}document.querySelector('#password').value='';out.textContent='';refresh()};
    document.querySelector('#create').onclick=async()=>{let r=await fetch('/auth/users',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:document.querySelector('#new-username').value,password:document.querySelector('#new-password').value})});out.textContent=r.ok?'Account created':(await r.json()).detail};
    document.querySelector('#logout').onclick=async()=>{await fetch('/auth/logout',{method:'POST'});refresh()};
    document.querySelector('#send').onclick=async()=>{out.textContent='Thinking…';let r=await fetch('/v1/chat/completions',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:document.querySelector('#prompt').value}]})});let j=await r.json();out.textContent=j.choices?.[0]?.message?.content||JSON.stringify(j,null,2)};
    refresh();
    </script></body></html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: page
          configMap: {name: frontend-page}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector: {app: frontend}
  ports:
    - port: 80
      targetPort: 80
